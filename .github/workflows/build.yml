name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: QR-save-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publicar APK en Releases (solo con firma permanente)
        if: ${{ env.KEYSTORE_PASSWORD != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk QR-save.apk
          gh release create "v1.1-${{ github.run_number }}" QR-save.apk --title "QR-save 1.1" --notes "APK firmado con la llave permanente" --repo "${{ github.repository }}"
