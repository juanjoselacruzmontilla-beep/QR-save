plugins {
    id 'com.android.application'
}

def ksPass = System.getenv("KEYSTORE_PASSWORD")

android {
    namespace 'com.qrsave.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.qrsave.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        if (ksPass) {
            release {
                storeFile file("${rootDir}/keystore/qrsave-release.p12")
                storeType "PKCS12"
                storePassword ksPass
                keyAlias "qrsave"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPass ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
